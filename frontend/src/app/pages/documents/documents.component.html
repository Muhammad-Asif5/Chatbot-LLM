<div *ngIf="uploading" class="uploading">Uploading & processing...</div>

<div class="card">
    <div class="card-body">
        <div class="d-flex align-items-center mb-4">
            <h5 class="card-title flex-grow-1 mb-0">📄 Documents</h5>
            <div class="flex-shrink-0">
                <input type="file" accept=".txt,.pdf,.docx,.xlsx,.csv" (change)="onFileSelect($event)"
                    class="form-control d-none" type="file" id="formFile">
                <label for="formFile" class="btn btn-danger"><i class="ri-upload-2-fill me-1 align-bottom"></i>
                    Upload Document</label>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-12">
                <div class="table-responsive">
                    <div *ngIf="loading" class="loading">Loading documents...</div>
                    <div *ngIf="!loading && docs.length === 0" class="empty">
                        No documents yet. Upload TXT, PDF, or DOCX files.
                    </div>

                    <table class="table table-borderless align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th scope="col">File Name</th>
                                <th scope="col">Type</th>
                                <th scope="col">Size</th>
                                <th scope="col">Upload Date</th>
                                <th scope="col">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let doc of docs">
                                <td>
                                    <div class="d-flex align-items-center">
                                        <div class="avatar-sm">
                                            <div class="avatar-title bg-success-subtle text-success rounded fs-20">
                                                <i class="ri-file-excel-fill"></i>
                                            </div>
                                        </div>
                                        <div class="ms-3 flex-grow-1">
                                            <h6 class="fs-15 mb-0"><a href="javascript:void(0);">{{ doc.filename }}</a>
                                            </h6>
                                        </div>
                                    </div>
                                </td>
                                <td>XSL File</td>
                                <td>2.38 KB</td>
                                <td>{{ doc.created_at | date:'medium' }}</td>
                                <td>
                                    <div class="dropdown">
                                        <a href="javascript:void(0);" class="btn btn-light btn-icon"
                                            id="dropdownMenuLink5" data-bs-toggle="dropdown" aria-expanded="true">
                                            <i class="ri-equalizer-fill"></i>
                                        </a>
                                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownMenuLink5">
                                            <li><a class="dropdown-item" href="javascript:void(0);"><i
                                                        class="ri-eye-fill me-2 align-middle text-muted"></i>View</a>
                                            </li>
                                            <li><a class="dropdown-item" href="javascript:void(0);"><i
                                                        class="ri-download-2-fill me-2 align-middle text-muted"></i>Download</a>
                                            </li>
                                            <li class="dropdown-divider"></li>
                                            <li><a (click)="deleteDoc(doc.id)" class="dropdown-item"
                                                    href="javascript:void(0);"><i
                                                        class="ri-delete-bin-5-line me-2 align-middle text-muted"></i>Delete</a>
                                            </li>
                                        </ul>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
